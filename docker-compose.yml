version: "3.9"

services:
  api:
    build: .
    entrypoint: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  dashboard:
    build: .
    entrypoint: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    environment:
      - EROSION_API_URL=http://api:8000
    depends_on:
      - api